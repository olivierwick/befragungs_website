<style>

    @keyframes wackeln {
        0%   { transform: rotate(0deg); }
        15%  { transform: rotate(-8deg); }
        35%  { transform: rotate(8deg); }
        55%  { transform: rotate(-5deg); }
        75%  { transform: rotate(5deg); }
        100% { transform: rotate(0deg); }

    #InfoButton {
        position: fixed;
        top: max(0px, env(safe-area-inset-top));
        left: 20px;
        right: 20px;

        padding: var(--pad);
        font-size: var(--fs);
        color: white;
        background: transparent;

        z-index: 10;
        filter: url(#rosenrot);
    }

    #LangButton {

        bottom: max(0px, env(safe-area-inset-bottom));

        right: 20px;
        border-top: var(--linie);

        padding: var(--pad);
        font-size: var(--fs);
        color: white;
        background: transparent;
        cursor: pointer;
        z-index: 10;
        filter: url(#rosenrot);
    }

    #container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
    }

    #content {
        display: flex;
        flex-direction: column;
        width: calc(100% - 40px);
        filter: url(#rosenrot);
    }

    #frage-nav {
        border-top: var(--linie);
        border-bottom: var(--linie);
        padding: 1px 0;
        font-size: var(--fs);
        color: white;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        user-select: none;
    }

    #frage-prev, #frage-next {
        display: block;
        position: absolute;
        top: 50%;
        height: 1.3em;
        width: 1.3em;
        object-fit: contain;

    #frage-prev { left: calc(50% - var(--pfeil-abstand)); transform: translate(-50%, -50%) rotate(180deg); }
    #frage-next { left: calc(50% + var(--pfeil-abstand)); transform: translate(-50%, -50%); }
    #container[dir="rtl"] #frage-prev { left: calc(50% + var(--pfeil-abstand)); transform: translate(-50%, -50%) rotate(0deg); }
    #container[dir="rtl"] #frage-next { left: calc(50% - var(--pfeil-abstand)); transform: translate(-50%, -50%) rotate(180deg); }

    #Frage1 {
        padding: 3px 14px;
        font-size: var(--fs);
        color: white;
        text-align: center;
        line-height: 1;
        hyphens: auto;
        overflow-wrap: break-word;
    }

    #eingabe-wrapper {
        position: relative;
        border-top: var(--linie);
        border-bottom: var(--linie);
        overflow: hidden;
    }

    #Eingabe {
        background: transparent;
        border: none;
        outline: none;
        padding: 5px 14px 3px;
        font-size: var(--fs);
        font-family: 'Ronzino', Arial, sans-serif;
        line-height: 1;
        color: white;
        caret-color: transparent;
        width: 100%;
        resize: none;
        overflow-y: scroll;
        scrollbar-width: none;
        height: 144px;
        text-align: center;
        display: block;
    }
    #Eingabe::-webkit-scrollbar { display: none; }

    #cursor-bar {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 10px;
        height: 90px;
        background: white;
        border-radius: 20px;
        animation: cursor-puls 2.2s ease-in-out infinite;
        pointer-events: none;
        z-index: 1;
        transition: height 0.2s ease;
        will-change: opacity;
    }

    #Submit {
        display: flex;
        justify-content: center;
        align-items: center;
        border-bottom: var(--linie);
        padding: var(--pad);
        font-size: var(--fs);
        color: white;
        text-align: center;
        cursor: pointer;
        white-space: nowrap;
    }

    #pfeil-phantom {
        display: inline-block;
        height: 0.9em;
        width: 0.9em;
        margin-right: 5px;
        flex-shrink: 0;
    }

    #pfeil {
        display: inline-block;
        height: 0.9em;
        width: 0.9em;
        margin-left: 5px;
        vertical-align: -0.05em;
        object-fit: contain;
        flex-shrink: 0;
        opacity: 0;
        will-change: opacity;
        transition: opacity 0.35s ease;
    }

    #LangView {
        display: none;
        position: fixed;
        top: 64px; bottom: 64px;
        left: 20px;
        right: 20px;
        flex-direction: column;
        justify-content: center;
        overflow-y: auto;
        z-index: 5;
        background: white;
    }
    #LangView.aktiv { display: flex; }

    .LangPill {
        border-bottom: var(--linie);
        padding: var(--pad);
        font-size: var(--fs);
        color: white;
        text-align: center;
        cursor: pointer;
        opacity: 0;
        background: transparent;
        flex-shrink: 0;
        filter: url(#rosenrot);
    }

    #InfoView {
        display: none;
        position: fixed;
        top: 64px; bottom: 64px;
        left: 20px;
        right: 20px;
        flex-direction: column;
        justify-content: center;
        overflow-x: hidden;
        overflow-y: auto;
        z-index: 5;
        background: white;
    }
    #InfoView.aktiv { display: flex; }

    #info-content {
        width: 100%;
        filter: url(#rosenrot);
    }

    #info-nav {
        border-top: var(--linie);
        border-bottom: var(--linie);
        padding: 1px 0;
        font-size: var(--fs);
        color: white;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        user-select: none;
        flex-shrink: 0;
        white-space: nowrap;
    }

    #info-prev, #info-next {
        display: block;
        position: absolute;
        top: 50%;
        height: 1.3em;
        width: 1.3em;
        object-fit: contain;

    img.link-pfeil {

        #frage-nav, #Frage1, #Submit, #Eingabe,

        #frage-prev, #frage-next, #pfeil, #info-prev, #info-next, img.link-pfeil { filter: none; }

}

    function addPfeilNachLinks(el) {
        el.querySelectorAll('a[href*="klybeckplus"], a[href*="olivierwick"], a[href*="zukunftklybeck"], a[href*="aefu.ch"], a[href*="instagram.com"], a[href^="mailto:"], a[href*="swisslife"], a[href*="rhystadt"], a[href*="bs.ch"]').forEach(function(a) {
            if (!a.querySelector('img.link-pfeil')) {
                var img = document.createElement('img');
                img.src = 'pfeil.png';
                img.className = 'link-pfeil';
                var wackelWorte = a.querySelectorAll('.wackel-wort');
                var wackelWort = wackelWorte.length > 0 ? wackelWorte[wackelWorte.length - 1] : null;
                if (wackelWort) {
                    wackelWort.appendChild(img);
                } else {
                    var walker = document.createTreeWalker(a, NodeFilter.SHOW_TEXT, null);
                    var lastTextNode = null, n;
                    while ((n = walker.nextNode())) lastTextNode = n;
                    if (lastTextNode) {
                        var text = lastTextNode.textContent;
                        var spaceIdx = text.lastIndexOf(' ');
                        var lastWord = spaceIdx >= 0 ? text.slice(spaceIdx + 1) : text;
                        var before = spaceIdx >= 0 ? text.slice(0, spaceIdx) : '';
                        var shyIdx = lastWord.lastIndexOf('­');
                        var finalBefore;
                        if (shyIdx >= 0) {
                            finalBefore = (before ? before + ' ' : '') + lastWord.slice(0, shyIdx + 1);
                            lastWord = lastWord.slice(shyIdx + 1);
                        } else {
                            finalBefore = before ? before + ' ' : '';
                        }
                        var nowrap = document.createElement('span');
                        nowrap.className = 'link-pfeil-nowrap';
                        nowrap.textContent = lastWord;
                        nowrap.appendChild(img);
                        lastTextNode.textContent = finalBefore;
                        lastTextNode.parentNode.insertBefore(nowrap, lastTextNode.nextSibling);
                    } else {
                        a.appendChild(img);
                    }
                }
            }
        });
    }

    function animiereFrageText(el, html, onFertig) {
        var STEP = 0.07;
        var d = 0;
        var re = /(<br\s*\/?>)|(<a\b[^>]*?>[\s\S]*?<\/a>)|(<span\b[^>]*?>[\s\S]*?<\/span>)|(<[^>]+>)|([^\s<]+)/g;
        var parts = [];
        var hadSpace = [];
        var prevEnd = 0;
        var m;
        while ((m = re.exec(html)) !== null) {
            hadSpace.push(m.index > prevEnd);
            prevEnd = m.index + m[0].length;
            if (/^<br/i.test(m[0])) {
                parts.push('<br>');
            } else if (m[4] !== undefined) {
                parts.push(m[0]);
            } else {
                parts.push('<span data-anim style="opacity:0;animation:einblenden 0.3s ease forwards ' + d + 's">' + m[0] + '</span>');
                d += STEP;
            }
        }
        var out = '';
        for (var i = 0; i < parts.length; i++) {
            if (i > 0 && hadSpace[i] && parts[i] !== '<br>') out += ' ';
            out += parts[i];
        }
        el.innerHTML = out;
        addPfeilNachLinks(el);
        el._animVer = (el._animVer || 0) + 1;
        var ver = el._animVer;
        setTimeout(function() {
            if (el._animVer !== ver) return;
            el.querySelectorAll('span[data-anim]').forEach(function(span) {
                var parent = span.parentNode;
                if (!parent) return;
                while (span.firstChild) parent.insertBefore(span.firstChild, span);
                parent.removeChild(span);
            });
            setTimeout(function() {
                if (el._animVer !== ver) return;
                if (onFertig) onFertig();
            }, 150);
        }, Math.round((d + 0.3) * 1000) + 200);
    }

        return idx;
    }

    function fuhreWackelAus(elemente) {
        if (!elemente.length) return;
        var kandidaten = elemente.length > 1
            ? elemente.filter(function(_, i) { return i !== letzterWackelIndex; })
            : elemente;
        if (!kandidaten.length) kandidaten = elemente;
        var ziel = kandidaten[Math.floor(Math.random() * kandidaten.length)];
        letzterWackelIndex = elemente.indexOf(ziel);
        var pfeil = ziel.querySelector('img.link-pfeil');
        if (!pfeil) return;
        pfeil.classList.remove('wackeln-auto');
        void pfeil.offsetWidth;
        pfeil.classList.add('wackeln-auto');
        setTimeout(function() { pfeil.classList.remove('wackeln-auto'); }, 400);
    }

    }

    function starteAutoWackeln(sofort) {

    function getMaxCharsPerLine() {
        var ta = document.getElementById("Eingabe");
        var fontSize = parseFloat(window.getComputedStyle(ta).fontSize);
        var contentWidth = ta.clientWidth - 28;
        var charsPerLine = Math.floor(contentWidth / (fontSize * 0.52));
        return Math.min(20, Math.max(8, charsPerLine));
    }

    document.getElementById("Eingabe").addEventListener("keydown", function(e) {
        const ta = this;
        const pos = ta.selectionStart;
        const lines = ta.value.split('\n');

        let lineStart = 0;
        let lineIndex = 0;
        for (let i = 0; i < lines.length; i++) {
            if (pos <= lineStart + lines[i].length) { lineIndex = i; break; }
            lineStart += lines[i].length + 1;
        }
        const posInLine = pos - lineStart;

        if (e.key === 'Enter') return;

        if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && posInLine >= getMaxCharsPerLine()) {
            e.preventDefault();
            const before = ta.value.slice(0, pos);
            const after = ta.value.slice(ta.selectionEnd);
            const trailingWord = (before.match(/[^\s]*$/) || [''])[0];
            if (trailingWord.length > 0 && !/\s/.test(e.key)) {
                const beforeWord = before.slice(0, before.length - trailingWord.length).trimEnd();
                ta.value = beforeWord + '\n' + trailingWord + e.key + after;
                ta.selectionStart = ta.selectionEnd = beforeWord.length + 1 + trailingWord.length + 1;
            } else {
                ta.value = before + '\n' + e.key + after;

                        var tSpan = tCont ? tCont.querySelectorAll('.wort')[msg.wortIdx] : null;
                        if (tSpan && msg.farbe) {
                            var tArr = tSpan.dataset.farben ? tSpan.dataset.farben.split('|') : [];
                            if (tArr.length < MAX_BALKEN) {
                                tArr.push(msg.farbe);
                                tSpan.dataset.farben = tArr.join('|');
                                tSpan.dataset.taps = tArr.length;
                                if (!tSpan.dataset.direction && msg.dir) tSpan.dataset.direction = msg.dir;
                                tSpan.classList.add('getippt');
                                berechneTapState(tCont);
                                tCont.classList.add('has-tap');
                            }
                        }
                    }
                } catch(_) {}
            };
            ws.onclose = function() {
                ws = null;
                setTimeout(verbinden, wsLokalGescheitert ? 3000 : 500);
            };
            ws.onerror = function() {
                wsLokalGescheitert = true; // localhost didn't work → switch to install IP
                ws.close();
            };
        }

        verbinden();

        // ── Gesten: Navigation + Wort-Tap ────────────────────────────────────
        var raumEl = document.getElementById('weisser-raum');
        if (raumEl) {
            var nX, nY, nT, nSW, nRoomClose;

            raumEl.addEventListener('touchstart', function(e) {
                var t = e.touches[0];
                nX = t.clientX; nY = t.clientY; nT = Date.now(); nSW = window.innerWidth;
                nRoomClose = false;
                e.stopPropagation();
                if (window.__raum) window.__raum.setTransition(false);
                seitenContainer.style.transition = 'none';
            }, { passive: false });

            raumEl.addEventListener('touchmove', function(e) {
                if (nX === undefined) return;
                e.preventDefault();
                e.stopPropagation();
                if (frageAktiv) return;
                var dx = e.touches[0].clientX - nX;
                if (aktuelleSeite === 0 && dx > 0) {
                    nRoomClose = true;
                    if (window.__raum) window.__raum.track(dx);
                } else {
                    nRoomClose = false;
                    var cdx = (aktuelleSeite >= 2 && dx < 0) ? 0 : dx;
                    seitenContainer.style.transform =
                        'translateX(' + (-aktuelleSeite * nSW + cdx) + 'px)';
                }
            }, { passive: false });

            raumEl.addEventListener('touchend', function(e) {
                if (nX === undefined) return;
                e.stopPropagation();
                var ct = e.changedTouches[0];
                var dx = ct.clientX - nX;
                var dy = ct.clientY - nY;
                var dt = Date.now() - nT;
                nX = undefined;

                if (frageAktiv) { zeigeSeite(0); return; }

                // Wort-Tap
                if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 300) {
                    // Doppeltipp-Zoom (iOS) unterbinden: jeder Tap-touchend wird abgefangen,
                    // damit der zweite schnelle Tap kein Zoom ausloest. Unser Tap-Handler laeuft weiter.
                    e.preventDefault();
                    var zielEl = document.elementFromPoint(ct.clientX, ct.clientY);
                    if (zielEl && zielEl.classList.contains('wort-inner')) zielEl = zielEl.parentElement;
                    if (zielEl && zielEl.classList.contains('wort')) {
                        var fbArr = zielEl.dataset.farben ? zielEl.dataset.farben.split('|') : [];
                        if (fbArr.length >= MAX_BALKEN) return;
                        var leftN = getPrevWort(zielEl), rightN = getNextWort(zielEl);
                        var dir = zielEl.dataset.direction;
                        if (!dir) {
                            if (leftN && leftN.dataset.direction && isSameLine(zielEl, leftN)) dir = leftN.dataset.direction;
                            else if (rightN && rightN.dataset.direction && isSameLine(zielEl, rightN)) dir = rightN.dataset.direction;
                            else dir = Math.random() < 0.5 ? '1' : '-1';
                        }
                        zielEl.dataset.direction = dir;
                        fbArr.push('hsl(330, 100%, 50%)');
                        zielEl.dataset.farben = fbArr.join('|');
                        zielEl.dataset.taps = fbArr.length;
                        zielEl.classList.add('getippt');
                        var seiteVonWort = -1, tapContainer = null;
                        for (var si = 0; si < seitenElemente.length; si++) {
                            if (seitenElemente[si].contains(zielEl)) { seiteVonWort = si; tapContainer = seitenElemente[si]; break; }
                        }
                        if (tapContainer) { berechneTapState(tapContainer); tapContainer.classList.add('has-tap'); }
                        if (seiteVonWort !== -1 && ws && ws.readyState === 1) {
                            var spans = seitenElemente[seiteVonWort].querySelectorAll('.wort');
                            var wIdx = Array.prototype.indexOf.call(spans, zielEl);
                            if (wIdx !== -1) ws.send(JSON.stringify({ type: 'word-tap', seite: seiteVonWort, wortIdx: wIdx, dir: dir, farbe: 'hsl(330, 100%, 50%)' }));
                        }
                    }
                    return;
                }

                // Raum schliessen (Wischgeste nach rechts auf Seite 0)
                if (nRoomClose) {
                    var speed = Math.abs(dx) / Math.max(1, dt);
                    if (window.__raum && (speed > 0.3 || Math.abs(dx) > nSW * 0.3)) {
                        window.__raum.snap(false);
                    } else {
                        if (window.__raum) window.__raum.snap(true);
                    }
                    zeigeSeite(0);
                    return;
                }

                // Seitennavigation
                var ziel = aktuelleSeite;
                if (dx < -50 && aktuelleSeite < 2) ziel++;
                else if (dx > 50 && aktuelleSeite > 0) ziel--;
                zeigeSeite(ziel);
            }, { passive: false });
        }
    })();

    // iOS-Safari ignoriert user-scalable=no und touch-action greift dort nicht zuverlaessig.
    // Fallback: schnellen zweiten Tap (Doppeltipp-Zoom) per preventDefault unterbinden.
    // Unsere eigenen Tap-Handler lesen die Touch-Koordinaten selbst aus und laufen weiter.
    (function() {
        var letzterTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            var ziel = e.target;
            if (ziel && (ziel.id === 'Eingabe' || ziel.tagName === 'TEXTAREA' || ziel.tagName === 'INPUT')) return;
            var jetzt = Date.now();
            if (jetzt - letzterTouchEnd <= 350) {
                e.preventDefault();
            }
            letzterTouchEnd = jetzt;
        }, { passive: false });
        // Zusaetzlich: Gesten-Events (Pinch) hart blockieren
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
    })();

</script>
</html>
